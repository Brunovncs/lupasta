name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev \
            libvulkan1 mesa-vulkan-drivers xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (core, layout sweep, golden comparison with the TypeScript original)
        run: cargo test

      # The real app is started against the fixture: it must lay out the tree, index it, find an
      # entry by search and have a working filesystem watcher, or it exits non-zero.
      - run: cargo run --example fixture
      - name: Build app
        run: cargo build
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a target/debug/lupasta --smoke --root fixtures/visual/Users --data-dir "$RUNNER_TEMP/smoke"
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: target/debug/lupasta --smoke --root fixtures/visual/Users --data-dir "$RUNNER_TEMP/smoke"
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process target\debug\lupasta.exe -ArgumentList '--smoke','--root','fixtures\visual\Users','--data-dir',"$env:RUNNER_TEMP\smoke" -PassThru -Wait -NoNewWindow
          exit $p.ExitCode
      - name: Smoke log
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/smoke/smoke.log" 2>/dev/null || echo "no smoke log"

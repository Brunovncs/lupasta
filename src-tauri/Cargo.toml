[package]
name = "lupasta"
version = "0.1.0"
description = "Spatial filesystem browser"
license = "MIT"
repository = "https://github.com/Brunovncs/lupasta"
edition = "2021"
default-run = "lupasta"

[lib]
name = "lupasta_lib"
crate-type = ["lib"]

[[bin]]
name = "lupasta"
path = "src/main.rs"
required-features = ["app"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

# The core (filesystem/index/search/watcher) builds and tests without Tauri;
# `app` adds the Tauri shell and the IPC commands.
[features]
default = ["app"]
app = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-clipboard-manager",
  "dep:tauri-plugin-window-state",
  "dep:ureq",
]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
nucleo-matcher = "0.3"
notify = "8"
ignore = "0.4"
crossbeam-channel = "0.5"
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
ureq = { version = "3", features = ["json"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

